<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="ru" lang="ru">
    <head>
        <title>English Words Trainer: Авторизация</title>
        <meta http-equiv="content-type" content="text/html; charset=utf-8" />
        <!--link rel="stylesheet" type="text/css" href="/media/css/common.css" /-->
        <link rel="stylesheet" type="text/css" href="/media/css/auth.css" />
		<link rel="shortcut icon" href="/media/imgs/favicon.png" />

		<script type="text/javascript" src="/media/js/libs/jquery-1.4.2.min.js"></script>
		<script type="text/javascript" src="/media/js/libs/jquery.loadmask.min.js"></script>
		<script type="text/javascript" src="/media/js/libs/jquery.dimensions.min.js"></script>
		<script type="text/javascript" src="/media/js/libs/jquery-ui-1.8.custom.min.js"></script>

		<script type="text/javascript" src="/media/js/libs/cufon-yui.js"></script>
		<script type="text/javascript" src="/media/js/libs/cufon-menu-font.js"></script>

		<script type="text/javascript" src="/media/js/app/auth.js"></script>
    </head>
    <body>
    	<div id="dialog" title="English Words Trainer">

		    <!-- Content -->
		    <div id="dialog-content">

				<form action="{% url 'index' %}" method="post" id="login-form">
					{% csrf_token %}
				  	<div class="form-row">
				    	<label for="id_username">Логин:</label> <input type="text" name="username" id="id_username" />
				  	</div>
				  	<div class="form-row">
				    	<label for="id_password">Пароль:</label> <input type="password" name="password" id="id_password" />
				  	</div>
				  	<div class="submit-row">
				    	<input type="submit" value="Вход" />
				  	</div>
				</form>

		    	{% if error_message %}
					<div class="error">{{ error_message }}</div>
				{% endif %}

				<!--br class="clear" /-->

			</div>
			
		</div>
	</body>
</html>
