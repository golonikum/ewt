{% for field in form %}
	{% ifequal field.label_tag|striptags "Слова с" %}
		<script>
			$(document).ready(function(){
				$("#id_from_date", EWT.utils.getActiveTab()).datepicker({dateFormat: 'yy-mm-dd'});
				$("#id_to_date", EWT.utils.getActiveTab()).datepicker({dateFormat: 'yy-mm-dd'});
			});
		</script>
	{% endifequal %}
    <div class="fieldWrapper">
        {{ field.label_tag }}<span class="form-colon">: </span>{{ field }}
		{{ field.errors }}
    </div>
	{% ifequal field.label_tag|striptags "Транскрипция" %}
		<div id="keyboard" style="width:306px;"></div>
		<script>
			$(document).ready(function(){
				$('#id_transcription', EWT.utils.getActiveTab()).transcription({
					keyboard: $('#keyboard', EWT.utils.getActiveTab())
				});
			});
		</script>
	{% endifequal %}
{% endfor %}
