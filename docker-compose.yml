services:
  db:
    # Django 6.1 требует PostgreSQL 15 или новее
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:-etrainer_golonru}
      POSTGRES_USER: ${DB_USER:-etrainer_golonru}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev-insecure-password}
    volumes:
      # Separate volume from the Postgres 9.6 era: a 9.6 data directory cannot
      # be read by 17, and keeping the old one intact leaves it recoverable.
      - postgres17_data:/var/lib/postgresql/data

  web:
    build: .
    command: python djproject/docker_start.py
    expose:
      - "8000"
    depends_on:
      - db
    environment:
      - DEBUG=${DEBUG:-True}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-}
      - USE_TEMPLATE_CACHE=${USE_TEMPLATE_CACHE:-1}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-3}
      - GUNICORN_TIMEOUT=${GUNICORN_TIMEOUT:-300}
      - EMAIL_BACKEND=${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      - DB_NAME=${DB_NAME:-etrainer_golonru}
      - DB_USER=${DB_USER:-etrainer_golonru}
      - DB_PASSWORD=${DB_PASSWORD:-dev-insecure-password}
      - DB_HOST=db
      - DB_PORT=5432
      - SECRET_KEY=${SECRET_KEY:-dev-insecure-secret-key}
      - DJANGO_ADMIN_USER=${DJANGO_ADMIN_USER:-admin}
      - DJANGO_ADMIN_PASSWORD=${DJANGO_ADMIN_PASSWORD:-admin}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - EMAIL_HOST=${EMAIL_HOST:-localhost}
      - EMAIL_PORT=${EMAIL_PORT:-25}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - SERVER_EMAIL=${SERVER_EMAIL:-admin@example.com}

  nginx:
    build:
      context: .
      dockerfile: docker/nginx.Dockerfile
    ports:
      - "${HTTP_PORT:-8000}:80"
    depends_on:
      - web

volumes:
  postgres17_data:
